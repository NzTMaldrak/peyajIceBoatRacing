name: IceBoatRacing
version: 3.0
main: peyaj.IceBoatRacing
api-version: "1.21"
authors: [peyaj]
description: Multi-arena Ice Boat Racing plugin with GUI, Replays, Parties, and more.
softdepend: [PlaceholderAPI]

commands:
  race:
    description: Main race command
    usage: /race <args>
    permission: race.use
  iceboat:
    description: Opens the main racing menu
    usage: /iceboat
    permission: race.use
  checkpoint:
    description: Respawn at your last checkpoint
    usage: /checkpoint
    aliases: [cp, stuck]
    permission: race.use
  racequit:
    description: Quickly leave a race
    usage: /racequit
    permission: race.use

permissions:
  race.admin:
    description: Admin access to setup arenas and force start/stop
    default: op
  race.use:
    description: Access to join and play races
    default: true
  race.trail.flame:
    description: Access to flame trail
    default: false
  race.trail.hearts:
    description: Access to hearts trail
    default: false
  race.trail.notes:
    description: Access to music notes trail
    default: false
  race.trail.sparks:
    description: Access to sparks trail
    default: false
  race.trail.magic:
    description: Access to magic trail
    default: false
  race.trail.ender:
    description: Access to ender trail
    default: false
  race.trail.rainbow:
    description: Access to rainbow trail
    default: false
  race.trail.soulfire:
    description: Access to soul fire trail
    default: false
  race.trail.water:
    description: Access to water trail
    default: false
  race.trail.snow:
    description: Access to snow trail
    default: false
  race.trail.cherry:
    description: Access to cherry blossom trail
    default: false
  race.trail.electric:
    description: Access to electric trail
    default: false
  race.trail.sculk:
    description: Access to sculk trail
    default: false
  race.trail.honey:
    description: Access to honey trail
    default: false
  race.trail.lava:
    description: Access to lava trail
    default: false